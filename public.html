<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swiss Trail & Rail Public Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --ink: #192126;
      --muted: #5f6b70;
      --line: #d6dddf;
      --paper: #ffffff;
      --panel: #eef2ee;
      --green: #4f7964;
      --blue: #537c98;
      --red: #b54839;
      --shadow: 0 18px 46px rgba(18, 30, 36, 0.16);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: #d7ded8;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(310px, 370px) minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
      min-height: 0;
    }

    aside {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--panel);
      border-right: 1px solid var(--line);
      z-index: 5;
    }

    header {
      flex: 0 0 auto;
      padding: 18px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    button,
    input,
    select,
    label.button {
      font: inherit;
      border-radius: 6px;
    }

    button,
    label.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 8px 11px;
      border: 1px solid #bbc5c8;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      text-decoration: none;
      font-weight: 680;
      white-space: nowrap;
    }

    button:hover,
    label.button:hover { background: #eef2f1; }

    input,
    select {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid #c6ced1;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #6b9280;
      box-shadow: 0 0 0 3px rgba(39, 116, 81, 0.14);
    }

    .controls {
      flex: 1 1 0;
      min-height: 0;
      padding: 14px 18px 18px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .file-input { display: none; }

    .status {
      margin-bottom: 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #405057;
      font-size: 13px;
      line-height: 1.35;
    }

    .status.warning {
      border-color: #d8a45c;
      background: #fff8ed;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .stat strong {
      display: block;
      font-size: 21px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .filter-grid input {
      grid-column: 1 / -1;
    }

    .route-list {
      display: grid;
      gap: 9px;
    }

    .route-card {
      width: 100%;
      justify-content: stretch;
      display: grid;
      gap: 6px;
      text-align: left;
      border-left: 4px solid var(--green);
      white-space: normal;
    }

    .route-card.train { border-left-color: var(--blue); }

    .route-card.selected {
      border-color: #1f2b2f;
      box-shadow: 0 0 0 3px rgba(31, 43, 47, 0.12);
    }

    .route-card strong {
      display: block;
      font-size: 14px;
      line-height: 1.2;
    }

    .route-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 3px 7px;
      border: 1px solid #d4dadd;
      border-radius: 999px;
      background: #f7faf9;
      color: #405057;
      font-size: 11px;
      font-weight: 700;
    }

    .empty {
      padding: 16px;
      border: 1px dashed #b9c3c6;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .legend {
      min-width: 190px;
      padding: 10px;
      border: 1px solid rgba(31, 43, 47, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
      color: var(--ink);
      font-size: 12px;
    }

    .legend strong {
      display: block;
      margin-bottom: 7px;
    }

    .legend-row {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      gap: 7px;
      align-items: center;
      margin-top: 5px;
    }

    .legend-line {
      width: 32px;
      height: 0;
      border-top: 4px solid var(--green);
      border-radius: 999px;
    }

    .legend-line.train { border-color: var(--blue); }

    .leaflet-popup-content {
      color: var(--ink);
      font: 13px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (max-width: 780px) {
      body { overflow: auto; }
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(390px, 52vh) auto;
        height: auto;
        min-height: 100vh;
      }
      #map {
        grid-row: 1;
        height: 52vh;
        min-height: 390px;
      }
      aside {
        grid-row: 2;
        border-right: 0;
        border-top: 1px solid var(--line);
      }
      .controls {
        overflow: visible;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <header>
        <h1>Swiss Trail & Rail Public Viewer</h1>
        <p>Read-only view for cleaned public route exports. No private browser archive is loaded here.</p>
      </header>
      <div class="controls">
        <div class="button-row">
          <label class="button" for="publicJsonFile">Load public JSON</label>
          <input class="file-input" id="publicJsonFile" type="file" accept=".json,application/json" />
          <button id="fitRoutesBtn" type="button">Fit routes</button>
          <button id="fitSwissBtn" type="button">Fit Switzerland</button>
        </div>
        <div class="status warning" id="status">Load a cleaned public JSON export from the overview page, or pass a hosted file with <code>?data=public-routes.json</code>.</div>
        <div class="stats">
          <div class="stat"><strong id="routeCount">0</strong><span>Routes shown</span></div>
          <div class="stat"><strong id="hikeKm">0 km</strong><span>Hiking</span></div>
          <div class="stat"><strong id="trainKm">0 km</strong><span>Train</span></div>
          <div class="stat"><strong id="gainM">0 m</strong><span>Elevation gain</span></div>
        </div>
        <div class="filter-grid">
          <input id="searchInput" type="search" placeholder="Search name, date, or tags" />
          <select id="typeFilter" aria-label="Filter route type">
            <option value="all">All types</option>
            <option value="hike">Hikes</option>
            <option value="train">Trains</option>
          </select>
          <select id="tagFilter" aria-label="Filter tag">
            <option value="all">All tags</option>
          </select>
        </div>
        <div class="route-list" id="routeList"></div>
      </div>
    </aside>
    <main id="map" aria-label="Public map of saved Switzerland routes"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const SWISS_BOUNDS = L.latLngBounds([45.72, 5.75], [47.9, 10.68]);
    const state = {
      routes: [],
      filtered: [],
      layers: new Map(),
      selectedId: ""
    };

    const el = {
      publicJsonFile: document.getElementById("publicJsonFile"),
      fitRoutesBtn: document.getElementById("fitRoutesBtn"),
      fitSwissBtn: document.getElementById("fitSwissBtn"),
      status: document.getElementById("status"),
      routeCount: document.getElementById("routeCount"),
      hikeKm: document.getElementById("hikeKm"),
      trainKm: document.getElementById("trainKm"),
      gainM: document.getElementById("gainM"),
      searchInput: document.getElementById("searchInput"),
      typeFilter: document.getElementById("typeFilter"),
      tagFilter: document.getElementById("tagFilter"),
      routeList: document.getElementById("routeList")
    };

    const topo = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
      maxZoom: 17,
      attribution: "Map data: &copy; OpenStreetMap contributors, SRTM | Tiles: &copy; OpenTopoMap"
    });
    const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    });
    const hikingOverlay = L.tileLayer("https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png", {
      maxZoom: 18,
      opacity: 0.62,
      attribution: "Hiking routes: Waymarked Trails"
    });
    const railOverlay = L.tileLayer("https://{s}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png", {
      maxZoom: 19,
      opacity: 0.55,
      attribution: "Rail: OpenRailwayMap"
    });

    const map = L.map("map", {
      center: [46.82, 8.23],
      zoom: 8,
      minZoom: 7,
      maxBounds: SWISS_BOUNDS.pad(0.35),
      layers: [topo, hikingOverlay, railOverlay]
    });
    L.control.layers({ Topographic: topo, Streets: osm }, { "Hiking paths": hikingOverlay, "Rail lines": railOverlay }, { collapsed: true }).addTo(map);
    const routeGroup = L.featureGroup().addTo(map);

    let legendElement = null;
    const legendControl = L.control({ position: "bottomright" });
    legendControl.onAdd = () => {
      legendElement = L.DomUtil.create("div", "legend");
      renderLegend();
      return legendElement;
    };
    legendControl.addTo(map);

    function setStatus(text, warning = false) {
      el.status.textContent = text;
      el.status.classList.toggle("warning", warning);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function pointInSwissBounds(point) {
      return Number.isFinite(point?.[0]) &&
        Number.isFinite(point?.[1]) &&
        SWISS_BOUNDS.contains(L.latLng(point[0], point[1]));
    }

    function normalizePoint(point) {
      const normalized = [Number(point?.[0]), Number(point?.[1])];
      if (Number.isFinite(Number(point?.[2]))) normalized.push(Number(point[2]));
      return normalized;
    }

    function normalizePublicRoute(route) {
      if (!route?.points || !Array.isArray(route.points)) return null;
      const points = route.points.map(normalizePoint).filter(point => Number.isFinite(point[0]) && Number.isFinite(point[1]));
      const waypoints = (route.waypoints || route.points).map(normalizePoint).filter(point => Number.isFinite(point[0]) && Number.isFinite(point[1]));
      if (points.length < 2 || !points.every(pointInSwissBounds) || !waypoints.every(pointInSwissBounds)) return null;
      return {
        id: String(route.id || crypto.randomUUID()),
        name: String(route.name || "Public route"),
        type: route.type === "train" ? "train" : "hike",
        date: route.date || "",
        tags: Array.isArray(route.tags) ? route.tags.map(String).filter(Boolean) : [],
        durationHours: Number(route.durationHours) || "",
        elevationGainM: Number(route.elevationGainM) || "",
        elevationLossM: Number(route.elevationLossM) || "",
        waypoints,
        points,
        metrics: route.metrics && typeof route.metrics === "object" ? { ...route.metrics } : {},
        updatedAt: route.updatedAt || ""
      };
    }

    function distanceKm(points) {
      let total = 0;
      for (let index = 1; index < points.length; index++) {
        total += L.latLng(points[index - 1][0], points[index - 1][1]).distanceTo(L.latLng(points[index][0], points[index][1])) / 1000;
      }
      return total;
    }

    function formatKm(value) {
      const km = Number(value) || 0;
      return km >= 10 ? `${km.toFixed(0)} km` : `${km.toFixed(1)} km`;
    }

    function formatTags(tags) {
      return Array.isArray(tags) ? tags.join(", ") : "";
    }

    function routeColor(type) {
      return type === "train" ? "#537c98" : "#4f7964";
    }

    function routeWeight(type) {
      return type === "train" ? 4 : 5;
    }

    function routeSearchText(route) {
      return [route.name, route.type, route.date, formatTags(route.tags)].join(" ").toLowerCase();
    }

    function applyFilters() {
      const query = el.searchInput.value.trim().toLowerCase();
      const type = el.typeFilter.value;
      const tag = el.tagFilter.value;
      state.filtered = state.routes.filter(route => {
        if (type !== "all" && route.type !== type) return false;
        if (tag !== "all" && !route.tags.includes(tag)) return false;
        return !query || routeSearchText(route).includes(query);
      });
      if (state.selectedId && !state.filtered.some(route => route.id === state.selectedId)) state.selectedId = "";
      render();
    }

    function renderTagFilter() {
      const current = el.tagFilter.value;
      const tags = [...new Set(state.routes.flatMap(route => route.tags))].sort((a, b) => a.localeCompare(b));
      el.tagFilter.innerHTML = `<option value="all">All tags</option>${tags.map(tag => `<option value="${escapeHtml(tag)}">${escapeHtml(tag)}</option>`).join("")}`;
      if (tags.includes(current)) el.tagFilter.value = current;
    }

    function routePopup(route) {
      const rows = [
        `<strong>${escapeHtml(route.name)}</strong>`,
        route.type === "train" ? "Train route" : "Hike",
        `Distance: ${formatKm(distanceKm(route.points))}`,
        route.date ? `Date: ${escapeHtml(route.date)}` : "",
        route.elevationGainM ? `Elevation gain: ${escapeHtml(route.elevationGainM)} m` : "",
        route.tags.length ? `Tags: ${escapeHtml(formatTags(route.tags))}` : ""
      ].filter(Boolean);
      return rows.join("<br>");
    }

    function renderMap() {
      routeGroup.clearLayers();
      state.layers.clear();
      state.filtered.forEach(route => {
        const casing = L.polyline(route.points, {
          color: "#fffdf7",
          weight: routeWeight(route.type) + 5,
          opacity: 0.78,
          interactive: false
        });
        const line = L.polyline(route.points, {
          color: routeColor(route.type),
          weight: state.selectedId === route.id ? routeWeight(route.type) + 3 : routeWeight(route.type),
          opacity: state.selectedId === route.id ? 1 : 0.9
        }).bindPopup(routePopup(route));
        line.on("click", () => selectRoute(route.id, false));
        routeGroup.addLayer(casing);
        routeGroup.addLayer(line);
        state.layers.set(route.id, line);
      });
      renderLegend();
    }

    function renderStats() {
      const totals = state.filtered.reduce((acc, route) => {
        const km = distanceKm(route.points);
        if (route.type === "train") acc.trainKm += km;
        else {
          acc.hikeKm += km;
          acc.gain += Number(route.elevationGainM) || 0;
        }
        return acc;
      }, { hikeKm: 0, trainKm: 0, gain: 0 });
      el.routeCount.textContent = state.filtered.length;
      el.hikeKm.textContent = formatKm(totals.hikeKm);
      el.trainKm.textContent = formatKm(totals.trainKm);
      el.gainM.textContent = `${Math.round(totals.gain)} m`;
    }

    function renderList() {
      if (!state.filtered.length) {
        el.routeList.innerHTML = `<div class="empty">No public routes match the current filters.</div>`;
        return;
      }
      el.routeList.innerHTML = state.filtered.map(route => {
        const km = formatKm(distanceKm(route.points));
        const tags = route.tags.slice(0, 5).map(tag => `<span class="pill">${escapeHtml(tag)}</span>`).join("");
        return `
          <button class="route-card ${route.type}${state.selectedId === route.id ? " selected" : ""}" type="button" data-route-id="${escapeHtml(route.id)}">
            <strong>${escapeHtml(route.name)}</strong>
            <span class="route-meta">
              <span>${route.type === "train" ? "Train" : "Hike"}</span>
              <span>${km}</span>
              ${route.date ? `<span>${escapeHtml(route.date)}</span>` : ""}
              ${route.elevationGainM ? `<span>+${escapeHtml(route.elevationGainM)} m</span>` : ""}
            </span>
            ${tags ? `<span class="route-meta">${tags}</span>` : ""}
          </button>
        `;
      }).join("");
    }

    function renderLegend() {
      if (!legendElement) return;
      const hikes = state.filtered.filter(route => route.type === "hike");
      const trains = state.filtered.filter(route => route.type === "train");
      legendElement.innerHTML = `
        <strong>Public routes</strong>
        <div class="legend-row"><span class="legend-line"></span><span>Hikes</span><span>${hikes.length}</span></div>
        <div class="legend-row"><span class="legend-line train"></span><span>Trains</span><span>${trains.length}</span></div>
      `;
    }

    function render() {
      renderMap();
      renderStats();
      renderList();
    }

    function fitRoutes() {
      if (!state.filtered.length) {
        map.fitBounds(SWISS_BOUNDS);
        return;
      }
      const bounds = L.latLngBounds([]);
      state.filtered.forEach(route => route.points.forEach(point => bounds.extend(L.latLng(point[0], point[1]))));
      map.fitBounds(bounds.pad(0.16));
    }

    function selectRoute(id, zoom = true) {
      const route = state.routes.find(item => item.id === id);
      if (!route) return;
      state.selectedId = id;
      render();
      const layer = state.layers.get(id);
      if (layer) layer.openPopup();
      if (zoom) map.fitBounds(L.latLngBounds(route.points.map(point => L.latLng(point[0], point[1]))).pad(0.22));
    }

    async function loadPublicData(data, label = "public JSON") {
      const routes = Array.isArray(data) ? data : data?.routes;
      if (!Array.isArray(routes)) throw new Error("Public JSON must contain a routes array.");
      const normalized = routes.map(normalizePublicRoute).filter(Boolean);
      state.routes = normalized;
      state.selectedId = "";
      renderTagFilter();
      applyFilters();
      fitRoutes();
      const skipped = routes.length - normalized.length;
      setStatus(`${normalized.length} public route${normalized.length === 1 ? "" : "s"} loaded from ${label}${skipped ? `; ${skipped} invalid or outside-Switzerland route${skipped === 1 ? "" : "s"} skipped.` : "."}`, skipped > 0);
    }

    async function loadFile(file) {
      const text = await file.text();
      await loadPublicData(JSON.parse(text), file.name);
    }

    async function loadFromUrl(url) {
      const response = await fetch(url, { headers: { Accept: "application/json" } });
      if (!response.ok) throw new Error(`Could not load ${url}`);
      await loadPublicData(await response.json(), url);
    }

    el.publicJsonFile.addEventListener("change", async event => {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        await loadFile(file);
      } catch (error) {
        setStatus(error.message || "Could not load public JSON.", true);
      } finally {
        el.publicJsonFile.value = "";
      }
    });

    el.fitRoutesBtn.addEventListener("click", fitRoutes);
    el.fitSwissBtn.addEventListener("click", () => map.fitBounds(SWISS_BOUNDS));
    el.searchInput.addEventListener("input", applyFilters);
    el.typeFilter.addEventListener("change", applyFilters);
    el.tagFilter.addEventListener("change", applyFilters);
    el.routeList.addEventListener("click", event => {
      const card = event.target.closest("[data-route-id]");
      if (card) selectRoute(card.dataset.routeId);
    });

    const dataUrl = new URLSearchParams(window.location.search).get("data");
    if (dataUrl) {
      loadFromUrl(dataUrl).catch(error => setStatus(error.message || "Could not load hosted public JSON.", true));
    } else {
      applyFilters();
      map.fitBounds(SWISS_BOUNDS);
    }
  </script>
</body>
</html>
